[package]
name = "teacher-work"
version = "0.9.0"
description = "教师工作台"
edition = "2021"

[features]
default = []
installed = []

[lib]
name = "teacher_work_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rfd = "0.15"
tauri-plugin-process = "2.3"
tauri-plugin-updater = "2.10"
